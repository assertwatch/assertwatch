name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Smoke test the uvx entry point
        run: uvx --from . assertwatch --version

  assertwatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Report only by default. Set the repository variable ASSERTWATCH_FAIL_ON
      # to "block" or "warn" (Settings > Secrets and variables > Actions) to fail
      # the job on findings without editing this file.
      - uses: ./
        with:
          fail-on: ${{ vars.ASSERTWATCH_FAIL_ON || 'never' }}
