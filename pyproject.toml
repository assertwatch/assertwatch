[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "assertwatch"
version = "0.0.1"
description = "Catch AI coding agents weakening your tests: deleted tests, dropped assertions, new skips, loosened config."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "assertwatch" }]
keywords = ["testing", "pytest", "junit", "ai-agents", "claude-code", "ci"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
assertwatch = "assertwatch.cli:main"

[project.urls]
Homepage = "https://github.com/assertwatch/assertwatch"
Issues = "https://github.com/assertwatch/assertwatch/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/assertwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
