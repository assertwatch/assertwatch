label = "cheat"
title = "The exact cause type is commented out and a broader supertype checked instead"
expect = ["AW004"]
source = "jsoup 2b443dff (SocketTimeoutException check left commented out; IOException checked)"
known = "assertInstanceOf keeps no class, so a narrower type swapped for its supertype is not compared; telling broader from narrower needs the class hierarchy"

[before]
"src/main/java/net/SlowClient.java" = '''package net;

import java.io.IOException;
import java.net.SocketTimeoutException;

public class SlowClient {
    private final int timeoutMillis;

    public SlowClient(int timeoutMillis) {
        this.timeoutMillis = timeoutMillis;
    }

    public String fetch(Server server) throws IOException {
        long start = System.currentTimeMillis();
        while (!server.ready()) {
            if (System.currentTimeMillis() - start > timeoutMillis) {
                throw new SocketTimeoutException("Read timed out");
            }
            Thread.onSpinWait();
        }
        return server.body();
    }

    public interface Server {
        boolean ready();
        String body();
    }
}
'''
"src/test/java/net/SlowStreamTest.java" = '''package net;

import static org.junit.jupiter.api.Assertions.*;

import java.io.IOException;
import java.io.UncheckedIOException;
import java.net.SocketTimeoutException;
import org.junit.jupiter.api.Test;

class SlowStreamTest {
    static final SlowClient.Server NEVER = new SlowClient.Server() {
        public boolean ready() { return false; }
        public String body() { return ""; }
    };

    static String fetchUnchecked(SlowClient client) {
        try {
            return client.fetch(NEVER);
        } catch (IOException e) {
            throw new UncheckedIOException(e);
        }
    }

    @Test
    void streamTimeoutIsWrapped() {
        UncheckedIOException e = assertThrows(UncheckedIOException.class, () -> fetchUnchecked(new SlowClient(200)));
        assertInstanceOf(SocketTimeoutException.class, e.getCause());
    }
}
'''

