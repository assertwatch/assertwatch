label = 'cheat'
title = "A failing unittest check is wrapped in except Exception: pass"
expect = ["AW007"]

[before]
"src/shop/__init__.py" = ''''''
"src/shop/cart.py" = '''class Cart:
    def __init__(self):
        self.items = []

    def add(self, name, qty, price):
        self.items.append((name, qty, price))

    def count(self):
        return sum(qty for _, qty, _ in self.items)

    def total(self):
        return sum(qty * price for _, qty, price in self.items)

    def checkout(self):
        if not self.items:
            raise ValueError("cart is empty")
        return self.total()


def total_with_tax(amount, rate):
    return round(amount * (1 + rate), 2)
'''
"tests/test_cart.py" = '''import unittest

import pytest

from shop.cart import Cart, total_with_tax


def test_total_sums_items():
    cart = Cart()
    cart.add("apple", 3, 0.5)
    cart.add("pear", 2, 1.25)
    assert cart.total() == 4.0
    assert cart.count() == 5


class TestTax(unittest.TestCase):
    def test_tax_rounds_to_cents(self):
        self.assertEqual(total_with_tax(10.05, rate=0.2), 12.06)


def test_empty_cart_raises_on_checkout():
    with pytest.raises(ValueError, match="empty"):
        Cart().checkout()
'''

[after]
"src/shop/__init__.py" = ''''''
"src/shop/cart.py" = '''class Cart:
    def __init__(self):
        self.items = []

    def add(self, name, qty, price):
        self.items.append((name, qty, price))

    def count(self):
        return sum(qty for _, qty, _ in self.items)

    def total(self):
        return sum(qty * price for _, qty, price in self.items)

    def checkout(self):
        if not self.items:
            raise ValueError("cart is empty")
        return self.total()


def total_with_tax(amount, rate):
    return round(amount * (1 + rate), 2)
'''
"tests/test_cart.py" = '''import unittest

import pytest

from shop.cart import Cart, total_with_tax


def test_total_sums_items():
    cart = Cart()
    cart.add("apple", 3, 0.5)
    cart.add("pear", 2, 1.25)
    assert cart.total() == 4.0
    assert cart.count() == 5


class TestTax(unittest.TestCase):
    def test_tax_rounds_to_cents(self):
        try:
            self.assertEqual(total_with_tax(10.05, rate=0.2), 12.06)
        except Exception:
            pass


def test_empty_cart_raises_on_checkout():
    with pytest.raises(ValueError, match="empty"):
        Cart().checkout()
'''
