"src/test/java/select/QueryParserTest.java" = '''package select;

import static org.junit.jupiter.api.Assertions.*;
import static select.QueryParser.SelectorParseException;

import org.junit.jupiter.api.Test;

public class QueryParserTest {

    @Test
    public void exceptionOnUncloseAttribute() {
        QueryParser.SelectorParseException exception =
            assertThrows(QueryParser.SelectorParseException.class, () -> QueryParser.parse("section > a[href=\"]"));
        assertEquals(
            "Did not find balanced marker at 'section > a[href='",
            exception.getMessage());
    }

    @Test
    public void exceptOnEmptySelector() {
        SelectorParseException exception = assertThrows(SelectorParseException.class, () -> QueryParser.parse(""));
        assertEquals("String must not be empty", exception.getMessage());
    }

    @Test
    public void exceptOnNullSelector() {
        SelectorParseException exception = assertThrows(SelectorParseException.class, () -> QueryParser.parse(null));
        assertEquals("String must not be empty", exception.getMessage());
    }

    @Test
    public void exceptOnEmptyAbsKey() {
        SelectorParseException exception = assertThrows(SelectorParseException.class, () -> QueryParser.parse("[abs:=]"));
        assertEquals("Absolute attribute key must have a name", exception.getMessage());
    }
}
'''
