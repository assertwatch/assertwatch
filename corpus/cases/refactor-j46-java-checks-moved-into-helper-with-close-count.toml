"src/test/java/core/FailedConstructionCloseTest.java" = '''package core;

import static org.junit.jupiter.api.Assertions.*;

import java.io.FilterWriter;
import java.io.IOException;
import java.io.StringWriter;
import java.io.Writer;
import org.junit.jupiter.api.Test;

class FailedConstructionCloseTest {
    static class CloseTrackingWriter extends FilterWriter {
        public boolean closed;
        public int closeCount;

        CloseTrackingWriter(Writer out) { super(out); }

        @Override
        public void close() throws IOException {
            closed = true;
            ++closeCount;
            super.close();
        }
    }

    @Test
    void writerClosedOnFailedConstruction() {
        CloseTrackingWriter w = new CloseTrackingWriter(new StringWriter());
        IOException e = assertThrows(IOException.class, () -> Generator.create(w, true));
        assertEquals("Test-induced construction failure", e.getMessage());
        assertTrue(w.closed);
    }

    @Test
    void writerClosedOnceOnFailedConstruction() {
        CloseTrackingWriter w = new CloseTrackingWriter(new StringWriter());
        IOException e = assertThrows(IOException.class, () -> Generator.create(w, true));
        assertEquals("Test-induced construction failure", e.getMessage());
        assertTrue(w.closed);
    }
}
'''

