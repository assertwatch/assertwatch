'''
"src/test/java/net/SlowClientTest.java" = '''package net;

import static org.junit.jupiter.api.Assertions.*;

import java.io.IOException;
import org.junit.jupiter.api.Test;

class SlowClientTest {
    private static final int TimeoutMillis = 200;

    static final SlowClient.Server NEVER = new SlowClient.Server() {
        public boolean ready() { return false; }
        public String body() { return ""; }
    };

    @Test
    void fetchThrowsOnTimeout() {
        assertThrows(IOException.class, () -> new SlowClient(TimeoutMillis).fetch(NEVER));
    }

    @Test
    void secondFetchAlsoTimesOut() {
        SlowClient client = new SlowClient(TimeoutMillis);
        assertThrows(IOException.class, () -> {
            client.fetch(NEVER);
            client.fetch(NEVER);
        });
    }
}
