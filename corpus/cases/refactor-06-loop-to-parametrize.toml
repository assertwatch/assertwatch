"tests/test_cart.py" = '''
import pytest

from shop.cart import Cart, total_with_tax


def test_total_sums_items():
    cart = Cart()
    cart.add("apple", 3, 0.5)
    cart.add("pear", 2, 1.25)
    assert cart.total() == 4.0
    assert cart.count() == 5


@pytest.mark.parametrize(("amount", "expected"), [(10.05, 12.06), (100, 120.0), (0.01, 0.01)])
