label = "refactor"
title = "A try/catch with a threw flag becomes an assigned assertThrows over two queries"
source = "jsoup bbb56af691 (threw flag became X ex = assertThrows, parametrized)"

[before]
"src/main/java/select/QueryParser.java" = '''package select;

public class QueryParser {
    public static class SelectorParseException extends IllegalStateException {
        public SelectorParseException(String message) { super(message); }
    }

    public static String parse(String query) {
        if (query == null || query.isEmpty()) {
            throw new SelectorParseException("String must not be empty");
        }
        String key = query.replace("[", "").replace("]", "").trim();
        if (key.startsWith("abs:") && key.substring(4).replaceAll("[!^$*~]?=", "").isEmpty()) {
            throw new SelectorParseException("Absolute attribute key must have a name");
        }
        int open = query.indexOf('"');
        if (open >= 0 && query.indexOf('"', open + 1) < 0) {
            throw new SelectorParseException("Did not find balanced marker at '" + query.substring(0, open) + "'");
        }
        return key;
    }
}
'''
"src/test/java/select/SelectorTest.java" = '''package select;

import static org.junit.jupiter.api.Assertions.*;

import org.junit.jupiter.api.Test;

public class SelectorTest {
    @Test void parseExceptionOnEmptyAbsKey() {
        // was previously firing at match time, not eval time
        String q = "[abs:!=]";
        boolean threw = false;
        try {
            QueryParser.parse(q);
        } catch (QueryParser.SelectorParseException ex) {
            threw = true;
            assertEquals("Absolute attribute key must have a name", ex.getMessage());
        }
        assertTrue(threw);
    }
}
'''

