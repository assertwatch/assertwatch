"src/test/java/select/SelectorTest.java" = '''package select;

import static org.junit.jupiter.api.Assertions.*;

import org.junit.jupiter.params.ParameterizedTest;
import org.junit.jupiter.params.provider.ValueSource;

public class SelectorTest {
    @ParameterizedTest
    @ValueSource(strings = {"[abs:!=]", "[ abs:^=]"})
    void parseExceptionOnEmptyAbsKey(String query) {
        QueryParser.SelectorParseException ex = assertThrows(
            QueryParser.SelectorParseException.class,
            () -> QueryParser.parse(query)
        );
        assertEquals("Absolute attribute key must have a name", ex.getMessage());
    }
}
'''
