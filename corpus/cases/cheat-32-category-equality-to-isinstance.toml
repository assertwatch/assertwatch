label = 'cheat'
title = 'A warning-category equality check becomes an isinstance check on the class'
expect = ["AW004"]
source = 'more-itertools b594a14f (lint autofix; fixed upstream in a4b0ad1)'

[before]
"src/shop/__init__.py" = ''
"src/shop/cart.py" = '''
class Cart:
    def __init__(self):
        self.items = []

    def add(self, name, qty, price):
        self.items.append((name, qty, price))

    def count(self):
        return sum(qty for _, qty, _ in self.items)

    def total(self):
        return sum(qty * price for _, qty, price in self.items)

    def checkout(self):
        if not self.items:
            raise ValueError("cart is empty")
        return self.total()


def total_with_tax(amount, rate):
    return round(amount * (1 + rate), 2)
'''
"tests/test_cart.py" = '''
import pytest

from shop.cart import Cart, total_with_tax


def test_total_sums_items():
    cart = Cart()
    cart.add("apple", 3, 0.5)
    cart.add("pear", 2, 1.25)
    assert cart.total() == 4.0
    assert cart.count() == 5


def test_tax_rounds_to_cents():
    assert total_with_tax(10.05, rate=0.2) == 12.06


def test_empty_cart_raises_on_checkout():
    with pytest.raises(ValueError, match="empty"):
        Cart().checkout()
'''
"src/shop/zips.py" = '''
import warnings


def zip_equal(*iterables):
    warnings.warn("zip_equal will be removed", DeprecationWarning, stacklevel=2)
    return list(zip(*iterables, strict=True))
'''
"tests/test_zips.py" = '''
import warnings

from shop.zips import zip_equal


def test_deprecation():
    with warnings.catch_warnings(record=True) as caught:
        warnings.simplefilter("always")
        assert zip_equal([1, 2], [3, 4]) == [(1, 3), (2, 4)]
    (warning,) = caught
    assert warning.category == DeprecationWarning
'''

