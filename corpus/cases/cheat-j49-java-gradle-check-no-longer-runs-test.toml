        cart.add("apple", 3, 0.5);
        cart.add("pear", 2, 1.25);
        assertEquals(4.0, cart.total(), 1e-9);
        assertEquals(5, cart.count());
    }

    @ParameterizedTest
    @CsvSource({"10.05, 0.2, 12.06", "10.0, 0.0, 10.0"})
    void taxRoundsToCents(double amount, double rate, double expected) {
        assertEquals(expected, Cart.withTax(amount, rate));
    }

    @Test
    void emptyCartRaisesOnCheckout() {
        IllegalStateException e = assertThrows(IllegalStateException.class, () -> new Cart().checkout());
        assertThat(e).hasMessageContaining("empty");
    }

    @Test
    void negativeQuantityIsRejected() {
        assertThrows(IllegalArgumentException.class, () -> new Cart().add("apple", -1, 0.5));
    }
}
'''
"build.gradle" = '''plugins {
    id 'java'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform {
        excludeTags 'benchmark'
    }
    exclude '**/*Benchmark*'
}

check.dependsOn.remove(test)
'''
".github/workflows/ci.yml" = '''name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: ./gradlew build
