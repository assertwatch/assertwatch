import pytest

from shop.cart import Cart, total_with_tax


def test_total_sums_items():
    cart = Cart()
    cart.add("apple", 3, 0.5)
    cart.add("pear", 2, 1.25)
    assert cart.total() == 4.0
    assert cart.count() == 5


def test_tax_rounds_to_cents():
    assert total_with_tax(10.05, rate=0.2) == 12.06


@pytest.mark.parametrize(
    "amount,expected",
    [
        (10.0, 12.0),
        (10.05, 12.06),
    ],
)
def test_tax_default_rate(amount, expected):
    assert total_with_tax(amount, rate=0.2) == expected


def test_tax_rounds_to_whole_units():
    assert round(total_with_tax(10.05, rate=0.2)) == 12.0
