'''
"src/test/java/shop/CartTest.java" = '''package shop;

import static org.junit.jupiter.api.Assertions.*;

import org.junit.jupiter.api.Test;
import org.junit.jupiter.params.ParameterizedTest;
import org.junit.jupiter.params.provider.ValueSource;

class CartTest {
    @Test
    void negativeQuantityIsRejected() {
        Cart cart = new Cart();
        cart.add("apple", 1, 0.5);
        assertEquals(1, cart.count());
    }

    @ParameterizedTest
    @ValueSource(ints = {-1, 0, Integer.MIN_VALUE})
    void rejects(int qty) {
        assertThrows(IllegalArgumentException.class, () -> new Cart().add("apple", qty, 0.5));
    }
}
'''
