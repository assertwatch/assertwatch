label = 'cheat'
title = 'The undecodable bytes input is swapped for an already-decoded string'
expect = ["AW005"]
source = 'click 2fa500c1 (fix filename formatting test for Windows compatibility)'

[before]
"src/shop/__init__.py" = ''
"src/shop/cart.py" = '''
class Cart:
    def __init__(self):
        self.items = []

    def add(self, name, qty, price):
        self.items.append((name, qty, price))

    def count(self):
        return sum(qty for _, qty, _ in self.items)

    def total(self):
        return sum(qty * price for _, qty, price in self.items)

    def checkout(self):
        if not self.items:
            raise ValueError("cart is empty")
        return self.total()


def total_with_tax(amount, rate):
    return round(amount * (1 + rate), 2)
'''
"tests/test_cart.py" = '''
import pytest

from shop.cart import Cart, total_with_tax


def test_total_sums_items():
    cart = Cart()
    cart.add("apple", 3, 0.5)
    cart.add("pear", 2, 1.25)
    assert cart.total() == 4.0
    assert cart.count() == 5


def test_tax_rounds_to_cents():
    assert total_with_tax(10.05, rate=0.2) == 12.06


def test_empty_cart_raises_on_checkout():
    with pytest.raises(ValueError, match="empty"):
        Cart().checkout()
'''
"src/shop/paths.py" = '''
import os


def format_filename(name, shorten=False):
    if isinstance(name, bytes):
        name = name.decode("utf-8", "replace")
    return os.path.basename(name) if shorten else name
'''
"tests/test_paths.py" = '''
from shop.paths import format_filename


def test_filename_formatting():
    assert format_filename(b"foo.txt") == "foo.txt"
    assert format_filename("/x/foo.txt", shorten=True) == "foo.txt"
    assert format_filename(b"/x/\xff.txt", shorten=True) == "\ufffd.txt"
'''

