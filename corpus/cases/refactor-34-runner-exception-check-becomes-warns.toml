import click
import pytest


def test_duplicate_option_warns(runner):
    @click.command()
    @click.option("--xyz", "xyz")
    @click.option("--xyz", "other")
    def cli(xyz, other):
        click.echo(repr(xyz), nl=False)

    result = runner.invoke(cli, [])
    assert result.exit_code == 1
    assert isinstance(result.exception, UserWarning)
    assert "used more than once" in str(result.exception)
