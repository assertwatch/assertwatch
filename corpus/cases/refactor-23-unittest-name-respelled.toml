"src/shop/cart.py" = '''
class Cart:
    def __init__(self):
        self.items = []

    def add(self, name, qty, price):
        self.items.append((name, qty, price))

    def count(self):
        return sum(qty for _, qty, _ in self.items)

    def total(self):
        return sum(qty * price for _, qty, price in self.items)

    def checkout(self):
        if not self.items:
            raise ValueError("cart is empty")
        return self.total()


def total_with_tax(amount, rate):
    return round(amount * (1 + rate), 2)
'''
"tests/test_cart.py" = '''
import pytest

from shop.cart import Cart, total_with_tax


def test_total_sums_items():
    cart = Cart()
    cart.add("apple", 3, 0.5)
    cart.add("pear", 2, 1.25)
    assert cart.total() == 4.0
    assert cart.count() == 5


def test_tax_rounds_to_cents():
    assert total_with_tax(10.05, rate=0.2) == 12.06


def test_empty_cart_raises_on_checkout():
    with pytest.raises(ValueError, match="empty"):
        Cart().checkout()
'''
"src/shop/tz.py" = '''
import weakref

_cache = weakref.WeakValueDictionary()


class tzoffset:
    def __new__(cls, name, seconds):
        key = (name, seconds)
        obj = _cache.get(key)
        if obj is None:
            obj = super().__new__(cls)
            _cache[key] = obj
        return obj
'''
"tests/test_tz.py" = '''
import gc
import unittest

import pytest

from shop import tz


class TzOffsetTest(unittest.TestCase):
    def testTzOffsetWeakRef(self):
        UTC1 = tz.tzoffset("UTC", 0)
        UTC2 = tz.tzoffset("UTC", 0)
        assert id(UTC1) == id(UTC2)
        weak_ref_id = id(UTC1)
        del UTC1
        del UTC2
        gc.collect()
        UTC3 = tz.tzoffset("UTC", 0)
        assert not weak_ref_id == id(UTC3)


@pytest.mark.parametrize("args", [("UTC", 0), ("EST", -18000)])
def test_tzoffset_singleton(args):
    assert tz.tzoffset(*args) is tz.tzoffset(*args)
'''

