label = 'cheat'
title = 'A test disabled only on Windows is removed: it ran everywhere else'
expect = ['AW001']

[before]
"src/main/java/shop/Cart.java" = '''package shop;

import java.util.ArrayList;
import java.util.List;

public class Cart {
    private final List<double[]> items = new ArrayList<>();

    public void add(String name, int qty, double price) {
        if (qty <= 0) throw new IllegalArgumentException("qty must be positive");
        items.add(new double[] {qty, price});
    }

    public int count() {
        return items.stream().mapToInt(i -> (int) i[0]).sum();
    }

    public double total() {
        return items.stream().mapToDouble(i -> i[0] * i[1]).sum();
    }

    public double checkout() {
        if (items.isEmpty()) throw new IllegalStateException("cart is empty");
        return total();
    }

    public static double withTax(double amount, double rate) {
        return Math.round(amount * (1 + rate) * 100) / 100.0;
    }
}
'''
"src/test/java/shop/CartTest.java" = '''package shop;

import static org.junit.jupiter.api.Assertions.*;

import org.junit.jupiter.api.Disabled;
import org.junit.jupiter.api.Test;
import org.junit.jupiter.api.condition.DisabledOnOs;
import org.junit.jupiter.api.condition.OS;

class CartTest {
    @Test
    void totalSumsItems() {
        Cart cart = new Cart();
        cart.add("apple", 3, 0.5);
        assertEquals(1.5, cart.total(), 1e-9);
    }


    @Test
    @DisabledOnOs(OS.WINDOWS)
    void manyItemsStayFast() {
        Cart cart = new Cart();
        for (int i = 0; i < 1_000_000; i++) cart.add("apple", 1, 0.5);
        assertEquals(500000.0, cart.total(), 1e-6);
    }
}
'''

